# ================================
# DATASOURCE
# ================================

# Dev local
spring.datasource.url=jdbc:postgresql://localhost:5432/simlady
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=sa
spring.datasource.password=your_password_here
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Dev local: create | Railway: update
spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ================================
# SWAGGER
# ================================
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Railway only
# springdoc.swagger-ui.url=/v3/api-docs
# server.forward-headers-strategy=framework

# ================================
# JWT
# ================================
jwt.validity=3600000
jwt.secret=your_jwt_secret_here

# ================================
# ACTUATOR
# ================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ================================
# CLERK SSO
# ================================
clerk.jwks-url=https://your-clerk-domain.clerk.accounts.dev/.well-known/jwks.json

# ================================
# CORS
# ================================
cors.allowed-origins=http://localhost:8081,http://localhost:3000