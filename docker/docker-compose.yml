version: '3.8'

services:
  postgres:
    image: postgres:17.5
    container_name: simlady-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simlady
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - simlady-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d simlady"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  simlady-postgres-data:
    driver: local

