name: Abrir Pull Request automático

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - dev
      - feature/*

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dev → Main
      - name: Cria PR de dev para main
        if: github.ref == 'refs/heads/dev'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: dev
          destination_branch: main
          pr_title: "PR automático: dev → main"
          pr_body: "PR criado automaticamente do dev para main."
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Feature/* → Teste
      - name: Cria PR de feature para teste
        if: startsWith(github.ref, 'refs/heads/feature/')
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ github.ref_name }}
          destination_branch: teste
          pr_title: "PR automático: ${{ github.ref_name }} → teste"
          pr_body: "PR criado automaticamente de ${{ github.ref_name }} para teste."
          github_token: ${{ secrets.GITHUB_TOKEN }}
